<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Organizations</title>
    <link rel="stylesheet" href="styles.css?v=20260818080808" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div>
          <p class="eyebrow">FactoryTalk Hub · Demo</p>
          <h1>Demo Organizations</h1>
          <p class="subtitle">
            Listing automatically updated from the demo environment.
          </p>
        </div>
        <div class="meta" id="meta">
          <span class="badge">Loading...</span>
        </div>
      </header>

      <section class="summary" id="summary" hidden></section>

      <section class="controls">
        <label class="search">
          <span>Search</span>
          <input
            id="search"
            type="search"
            placeholder="Name, tenant, email, domain..."
            autocomplete="off"
          />
        </label>
        <label class="filter">
          <span>Ownership</span>
          <select id="ownership-filter">
            <option value="all">All</option>
            <option value="Oncourse">Oncourse</option>
            <option value="HOL">HOL</option>
            <option value="Manticore">Manticore</option>
            <option value="Bugbounty">Bugbounty</option>
          </select>
        </label>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="name">Organization</th>
              <th data-sort="tenant">Tenant ID</th>
              <th data-sort="ownerEmail">Owner Email</th>
              <th data-sort="contractNumber">Contract</th>
              <th data-sort="effectiveDate">Effective</th>
              <th data-sort="expiryDate">Expiry</th>
              <th data-sort="daysToExpire">Days to Expire</th>
              <th data-sort="ownership">Ownership</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr>
              <td colspan="8" class="loading">Loading data...</td>
            </tr>
          </tbody>
        </table>
      </section>

      <footer class="footer">
        <p id="footer-text">Rockwell Automation CloudOps</p>
      </footer>
    </div>

    <script src="data/orgs.js?v=20260818080808"></script>
    <script src="app.js?v=20260818080808"></script>
  </body>
</html>
